name: 每日诗词节气内容生成

on:
  schedule:
    # 每天 UTC 23:00 = 北京时间 7:00
    - cron: "0 23 * * *"
  workflow_dispatch:
    # 支持手动触发
    inputs:
      dry_run:
        description: "只生成内容并提交，不跑 NotebookLM / Telegram / Instagram（调 prompt 用）"
        type: boolean
        default: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Restore NotebookLM auth
        # 认证失败不中止 job：main.py 会跳过信息图、发 Telegram、结尾 exit 1 标红，
        # 但当天的诗与考据仍然生成并提交（页面先写、图后补）
        continue-on-error: true
        run: |
          if [ -z "$NOTEBOOKLM_MASTER_TOKEN" ]; then
            echo "::error::缺少 secret NOTEBOOKLM_MASTER_TOKEN，无法生成 infographic。" \
                 "请执行：base64 -i ~/.notebooklm/profiles/default/master_token.json |" \
                 "gh secret set NOTEBOOKLM_MASTER_TOKEN"
            exit 1
          fi
          # 用长期 master token 现场 mint 一份新 cookie（无需浏览器），
          # 避免 storage_state 快照随 Google 轮转而过期
          mkdir -p ~/.notebooklm/profiles/default
          echo "$NOTEBOOKLM_MASTER_TOKEN" | base64 -d > ~/.notebooklm/profiles/default/master_token.json
          notebooklm auth refresh --verify
        env:
          NOTEBOOKLM_MASTER_TOKEN: ${{ secrets.NOTEBOOKLM_MASTER_TOKEN }}

      - name: Restore Instagram session
        if: env.IG_SESSION != ''
        run: |
          mkdir -p ~/.instagram
          echo "$IG_SESSION" | base64 -d > ~/.instagram/session.json
        env:
          IG_SESSION: ${{ secrets.IG_SESSION }}

      - name: Run pipeline
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_ENABLED: ${{ secrets.TELEGRAM_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_ENABLED: ${{ secrets.IG_ENABLED }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
        run: python main.py ${{ inputs.dry_run && '--no-nlm --no-ig' || '' }}

      - name: Commit generated content
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/content data/poem_history.json
          if git diff --cached --quiet; then
            echo "无新增内容，跳过提交"
            exit 0
          fi
          git commit -m "content: $(date -u +%Y-%m-%d) 每日诗词与背后的故事"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload output as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poem-output-${{ github.run_id }}
          path: output/
          retention-days: 7
