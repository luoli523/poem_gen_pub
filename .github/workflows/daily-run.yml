name: 每日诗词节气内容生成

on:
  schedule:
    # 每天 UTC 23:00 = 北京时间 7:00
    - cron: "0 23 * * *"
  workflow_dispatch:
    # 支持手动触发
    inputs:
      dry_run:
        description: "只生成内容并提交，不推送 Telegram、不通知图片机器人 webhook（调 prompt 用）"
        type: boolean
        default: false
      date:
        description: "指定日期 YYYY-MM-DD（留空 = 北京时间今天）；用于测试或回补节令日"
        type: string
        default: ""
      only_jieling:
        description: "只跑节令，不选诗（回补节令时用）"
        type: boolean
        default: false
      image_overwrite:
        description: "通知图片机器人覆盖已有 infographic.webp（默认不覆盖）"
        type: boolean
        default: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Restore Instagram session
        if: env.IG_SESSION != ''
        run: |
          mkdir -p ~/.instagram
          echo "$IG_SESSION" | base64 -d > ~/.instagram/session.json
        env:
          IG_SESSION: ${{ secrets.IG_SESSION }}

      - name: Run pipeline
        env:
          # 代码里 GROK_API_KEY 优先于 OPENAI_API_KEY；现用 OpenAI，故不再注入 Grok key
          # （secret 仍保留，回滚时把这一行加回来即可）
          # GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_ENABLED: ${{ secrets.TELEGRAM_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_ENABLED: ${{ secrets.IG_ENABLED }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
        run: >
          python main.py --image-webhook
          ${{ inputs.dry_run && '--no-nlm --no-ig' || '' }}
          ${{ inputs.date != '' && format('--date {0}', inputs.date) || '' }}
          ${{ inputs.only_jieling && '--no-poetry' || '' }}
          ${{ inputs.image_overwrite && '--image-overwrite' || '' }}

      - name: Commit generated content
        id: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/content data/poem_history.json
          committed=false
          if git diff --cached --quiet; then
            echo "无新增内容，跳过提交"
          else
            git commit -m "content: $(date -u +%Y-%m-%d) 每日诗词与背后的故事"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
            committed=true
          fi
          echo "committed=$committed" >> "$GITHUB_OUTPUT"

      - name: Notify image bot
        # 只在内容真正提交之后通知。dry_run 用来调 prompt，不跑外部发布
        # 图片由机器人异步生成并推回仓库；daily-run 不调用 NotebookLM。
        # 流水线 exit 1 但页面已提交时仍然 POST，机器人可以补图。
        # manifest 在两种情况下都会写到 output/infographic-manifests/，随 artifact 可查看。
        if: always() && cancelled() == false && steps.commit.conclusion == 'success' && steps.commit.outputs.committed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
        continue-on-error: true
        env:
          IMAGE_BOT_WEBHOOK_URL: ${{ secrets.IMAGE_BOT_WEBHOOK_URL }}
          IMAGE_BOT_WEBHOOK_KEY: ${{ secrets.IMAGE_BOT_WEBHOOK_KEY }}
        run: |
          if [ -z "$IMAGE_BOT_WEBHOOK_URL" ] || [ -z "$IMAGE_BOT_WEBHOOK_KEY" ]; then
            echo "::notice::缺少 secret IMAGE_BOT_WEBHOOK_URL 或 IMAGE_BOT_WEBHOOK_KEY，跳过信息图 webhook"
            exit 0
          fi
          shopt -s nullglob
          manifests=(output/infographic-manifests/*.json)
          if [ ${#manifests[@]} -eq 0 ]; then
            echo "本次提交没有信息图 manifest，跳过 webhook"
            exit 0
          fi
          failed=0
          while IFS= read -r manifest; do
            echo "通知信息图机器人: $(basename "$manifest")"
            if ! curl --fail-with-body --silent --show-error \
                --max-time 30 \
                -X POST \
                -H "Authorization: Bearer ${IMAGE_BOT_WEBHOOK_KEY}" \
                -H "Content-Type: application/json" \
                --data-binary @"$manifest" \
                "$IMAGE_BOT_WEBHOOK_URL"; then
              echo "::warning::信息图 webhook 失败: $(basename "$manifest")"
              failed=1
            fi
          done < <(printf '%s\n' "${manifests[@]}" | sort)
          exit "$failed"

      - name: Upload output as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poem-output-${{ github.run_id }}
          path: output/
          retention-days: 7
