# LLM 配置（兼容 OpenAI API 的服务均可使用，如 ChatGPT、Grok、DeepSeek 等）
# 节气内容、诗词匹配均使用此配置
openai:
  model: "gpt-5.6-terra"             # 2026-09 起用 OpenAI；grok-4-1-fast-reasoning 已成 legacy 型号
  # model: "grok-4-1-fast-reasoning" # 回滚：改回此行并在 daily-run.yml 的 env 里恢复 GROK_API_KEY
  max_completion_tokens: 16000       # 最大输出 token 数（含推理 token）
  # response_format 由各模块按需设置（节气/诗词=json_object）

# 输出配置
output:
  dir: "./output"

# 站点内容（Hugo 内容页，每日诗词 + 背后的故事，提交回 repo 持续积累）
site:
  content_dir: "./site/content/poems"
  terms_dir: "./site/content/terms"      # 节令档案：terms/<节令名>/<年>/

# 衍生一则（从诗中任一点跳出去的叙事故事）
# 材料来源问题未解决前默认关闭；可单独指定模型做对比实验
tale:
  enabled: false
  # model: "deepseek-chat"                 # 不填则沿用上面 openai.model
  # api_key_env: "DEEPSEEK_API_KEY"        # 从哪个环境变量读 key；不填则沿用主 key
  # base_url: "https://api.deepseek.com"   # 与 api_key_env 配套
  # max_completion_tokens: 8000            # DeepSeek 上限 8192，不填沿用 openai 段
