baseURL: "https://luoli523.github.io/poem_gen_pub/"
languageCode: zh-cn
defaultContentLanguage: zh-cn
title: 鬼话诗
enableRobotsTXT: true
hasCJKLanguage: true
buildFuture: true   # 流水线在 UTC 23:00 以北京日期落页，对 UTC 构建来说是"未来"

markup:
  goldmark:
    renderer:
      hardWraps: true       # 诗句按行断，一行一 <br>
      unsafe: false

# 分类维度：每首诗的 frontmatter 写入这些字段，Hugo 自动生成索引页
taxonomies:
  author: authors
  dynasty: dynasties
  occasion: occasions
  category: categories
  kind: kinds
  pivot_type: pivot_types
  jieling: jieling                     # 节令名：节令档案页与当天诗词页共用，互链
  jieling_category: jieling_categories # 节气 / 汉族节日 / 民族节日 / 具体民族

menu:
  main:
    - name: 诗词
      pageRef: /poems
      weight: 1
    - name: 节令
      pageRef: /terms
      weight: 2
    - name: 作者
      pageRef: /authors
      weight: 3
    - name: 朝代
      pageRef: /dynasties
      weight: 3
    - name: 场景
      pageRef: /occasions
      weight: 4
    - name: 素材
      pageRef: /categories
      weight: 5
    - name: 可信度
      pageRef: /kinds
      weight: 6

params:
  description: 每日一首古诗词，以及它背后的人、事、风土与传说。每条素材标注可信度与出处。
  taxonomyTitles:
    authors: 作者
    dynasties: 朝代
    occasions: 场景
    categories: 素材分类
    kinds: 可信度
    pivot_types: 衍生类型
    jieling: 节令
    jieling_categories: 节令类别
