{{- $img := .Page.Resources.Get .Destination -}}
{{- with $img -}}
<figure class="infographic"><img src="{{ .RelPermalink }}" width="{{ .Width }}" height="{{ .Height }}" alt="{{ $.Text }}" loading="lazy" decoding="async"></figure>
{{- else -}}
<img src="{{ .Destination | safeURL }}" alt="{{ .Text }}">
{{- end -}}
